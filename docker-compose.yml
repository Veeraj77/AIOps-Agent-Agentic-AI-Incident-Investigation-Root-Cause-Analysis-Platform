services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aiops-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - LLM_PROVIDER=groq
      - LLM_MODEL=${LLM_MODEL:-qwen/qwen3.8-27b}
      - DATABASE_URL=sqlite:///./storage/aiops.db
      - CHROMA_PERSIST_DIR=./storage/chroma_db
      - CORS_ORIGINS=http://localhost:5173,http://localhost:3000,http://localhost:80,http://127.0.0.1:3000,http://127.0.0.1:80
    volumes:
      - aiops_storage:/app/storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aiops-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  aiops_storage:
    driver: local
